<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.75rem;
      color: #333;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: bold;
      color: #333;
      margin-bottom: 0.25rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 0.25rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .error {
      color: #b00020;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }

    .field {
      margin-bottom: 0.75rem;
    }

    button {
      background-color: #333;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Contact Us</h1>
    {% if errors.form %}<div class="error">{{ errors.form }}</div>{% endif %}
    <form method="post" action="{{ url_for('submit') }}" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ values.name }}" required maxlength="200">
        {% if errors.name %}<div class="error">{{ errors.name }}</div>{% endif %}
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ values.email }}" required maxlength="200">
        {% if errors.email %}<div class="error">{{ errors.email }}</div>{% endif %}
      </div>
      <div class="field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" value="{{ values.subject }}" required maxlength="200">
        {% if errors.subject %}<div class="error">{{ errors.subject }}</div>{% endif %}
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required maxlength="2000">{{ values.message }}</textarea>
        {% if errors.message %}<div class="error">{{ errors.message }}</div>{% endif %}
      </div>
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
